databases:
  - name: moneymate-demo-db
    databaseName: moneymate
    user: moneymate
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: moneymate-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ENABLE_WHITENOISE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: moneymate-demo-db
          property: connectionString
